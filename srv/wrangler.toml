# Regarded Backend - Cloudflare Workers
# 
# SETUP FOR USERS:
# 1. Create D1 database: npx wrangler d1 create regarded-db
# 2. Create KV namespace: npx wrangler kv namespace create regarded-kv  
# 3. Uncomment and add database_id and KV id below
# 4. Set secrets: npx wrangler secret put GOOGLE_CLIENT_ID (etc)
#
# Worker name - override in your fork or CLI args:
#   wrangler deploy --name your-worker-name

main = "src/app.ts"
compatibility_date = "2024-01-01"
node_compat = true

# D2 Database - uncomment after creating:
# [[d1_databases]]
# binding = "DB"
# database_name = "regarded-db"
# database_id = "your-database-id"

# KV Namespace - uncomment after creating:
# [[kv_namespaces]]
# binding = "KV"
# id = "your-kv-namespace-id"

# Environment variables (set via: npx wrangler secret put <name>)
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# JWT_SECRET
