# Regarded Backend - Cloudflare Workers
# 
# IMPORTANT: Copy providers/cloudflare/wrangler.toml to srv/wrangler.toml
# and update with your actual KV/D1 IDs before deploying.
#
# See providers/cloudflare/ for the full configuration with staging/prod environments.

name = "regarded-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

# D2 Database
# Replace with your actual database_id after: npx wrangler d1 create regarded-db
[[d1_databases]]
binding = "DB"
database_name = "regarded-db"
database_id = "your-database-id-here"

# KV Namespace for sessions, cache, configs
# Replace with your actual KV id after: npx wrangler kv namespace create regarded-kv
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id-here"

# Environment variables (set via: npx wrangler secret put <name>)
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# JWT_SECRET
