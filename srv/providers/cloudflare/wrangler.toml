# Regarded Backend - Cloudflare Workers
# Run: npx wrangler dev
# Deploy: npx wrangler deploy

name = "regarded-backend"
main = "src/index.ts"
compatibility_date = "2024-01-01"
node_compat = true

# D2 Database
[[d1_databases]]
binding = "DB"
database_name = "regarded-db"
database_id = "your-database-id-here"  # Replace after: npx wrangler d1 create regarded-db

# KV Namespace for sessions, cache, configs
[[kv_namespaces]]
binding = "KV"
id = "your-kv-namespace-id-here"  # Replace after: npx wrangler kv namespace create regarded-kv

# Environment variables (set via: npx wrangler secret put <name>)
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# JWT_SECRET

[env.staging]
name = "regarded-backend-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "regarded-db-staging"
database_id = "your-staging-database-id"

[[env.staging.kv_namespaces]]
binding = "KV"
id = "your-staging-kv-id"

[env.production]
name = "regarded-backend-prod"

[[env.production.d1_databases]]
binding = "DB"
database_name = "regarded-db-prod"
database_id = "your-prod-database-id"

[[env.production.kv_namespaces]]
binding = "KV"
id = "your-prod-kv-id"
