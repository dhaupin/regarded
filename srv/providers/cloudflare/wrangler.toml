# Regarded Backend - Cloudflare Workers
# 
# SETUP: All config comes from environment variables (secrets)
# - D1/KV IDs: Set as GitHub/Cloudflare secrets
# - Other secrets: Set via wrangler secret put
#
# Worker name - override via CLI: wrangler deploy --name your-worker-name

main = "../../dist/worker.js"
compatibility_date = "2024-01-01"
node_compat = true

# D1 Database - IDs from CF secrets
[[d1_databases]]
binding = "DB"
database_name = "${CF_D1_NAME}"
database_id = "${CF_D1_ID}"

# KV Namespace - ID from CF_KV_ID env var
[[kv_namespaces]]
binding = "KV"
id = "${CF_KV_ID}"

[env.staging]
name = "regarded-staging"

[env.production]
name = "regarded-prod"
